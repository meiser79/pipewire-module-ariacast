# ~/.config/pipewire/pipewire.conf.d/ariacast.conf
#
# Drop this file into ~/.config/pipewire/pipewire.conf.d/
# and run:  systemctl --user restart pipewire
#
# All keys are optional. Without ariacast.server.host the module
# broadcasts "DISCOVER_AUDIOCAST" on UDP port 12888 (5 attempts, 3 s apart).

context.modules = [
  {
    name  = libpipewire-module-ariacast
    flags = [ ifexists nofail ]
    args  = {
      # Uncomment to skip discovery and use a fixed server:
      #"ariacast.server.host" = "192.168.1.10"
      #"ariacast.server.port" = "12889"
      #"ariacast.sink.name" = "ariacast"
      #"ariacast.sink.description" = "AriaCast Speaker"

      # Set to false to disable UDP broadcast discovery entirely.
      "ariacast.discovery.enabled" = "true"

      # With discovery enabled, the sink name and description are learned
      # automatically from the AriaCast server_name. The generated
      # description is: "<server_name> [AriaCast]".
      # Configure the following keys only when you want to override the
      # automatically generated values. Each key can be overridden alone.
      #"ariacast.sink.name" = "ariacast"
      #"ariacast.sink.description" = "AriaCast Speaker"
    }
  }
]
